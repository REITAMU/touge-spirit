<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FC Touge Racing - Prototype 0.4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;display:flex;justify-content:center;align-items:center;font-family:monospace;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:min(100vw,106.67vh);height:min(93.75vh,100vw*.9375);max-width:100vw;max-height:100vh;image-rendering:pixelated;border:4px solid #fff;box-shadow:0 0 20px rgba(255,255,255,.2)}
#touch{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}
button{width:62px;height:56px;border:2px solid #fff;border-radius:8px;color:#fff;background:#222d;font:bold 20px monospace;touch-action:none;padding:0}
button.active{background:#a33}
#gear{font-size:16px;background:#254c25}
</style>
</head>
<body>
<canvas id="gameCanvas" width="256" height="240"></canvas>
<div id="touch">
  <div class="pad"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="pad"><button id="gear">HI</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

let scrollY=0,speed=2,score=0,gameOver=false;
const player={x:120,y:180,width:12,height:18,steerSpeed:3};
const courseWidth=100;
const keys={};
const touch={left:false,right:false,high:false};
const enemies=[
 {y:-50,speedOffset:1.0,color:"#0088ff",width:12,height:18,x:0,laneOffset:-25},
 {y:-150,speedOffset:1.5,color:"#ffcc00",width:12,height:18,x:0,laneOffset:0},
 {y:-250,speedOffset:.8,color:"#ff00ff",width:12,height:18,x:0,laneOffset:25}
];

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key))e.preventDefault();
},{passive:false});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function bindButton(id,key){
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();touch[key]=true;el.classList.add("active");};
 const up=e=>{e.preventDefault();touch[key]=false;el.classList.remove("active");};
 el.addEventListener("pointerdown",down);
 ["pointerup","pointercancel","pointerleave","lostpointercapture"].forEach(t=>el.addEventListener(t,up));
}
bindButton("left","left");bindButton("right","right");bindButton("gear","high");

const leftHeld=()=>keys.arrowleft||keys.a||touch.left;
const rightHeld=()=>keys.arrowright||keys.d||touch.right;
const highHeld=()=>keys.arrowup||keys.w||touch.high;

function getCourseCenterX(y){
 return 128
  +Math.sin((y-scrollY)*.010)*40
  +Math.sin((y-scrollY)*.017+1.2)*13;
}

function resetEnemy(enemy){
 enemy.y=-40-Math.random()*100;
 // 道路の中心からの横位置を保存。以後は道路のカーブに追従させる
 const laneChoices=[-28,0,28];
 enemy.laneOffset=laneChoices[Math.floor(Math.random()*laneChoices.length)];
 enemy.speedOffset=.5+Math.random()*1.2;
 const center=getCourseCenterX(enemy.y+enemy.height/2);
 enemy.x=center-enemy.width/2+enemy.laneOffset;
}
enemies.forEach(resetEnemy);

function resetGame(){
 scrollY=0;speed=2;score=0;player.x=120;gameOver=false;
 enemies.forEach(resetEnemy);
}

function update(){
 if(gameOver){
  if(keys[" "]||keys.enter)resetGame();
  return;
 }
 // HIは速度4、LOWは速度2
 speed=highHeld()?4:2;
 scrollY+=speed;
 score+=1;

 if(leftHeld())player.x-=player.steerSpeed;
 if(rightHeld())player.x+=player.steerSpeed;

 const pCenter=getCourseCenterX(player.y+player.height/2);
 if(player.x<pCenter-courseWidth/2||(player.x+player.width)>pCenter+courseWidth/2)gameOver=true;

 enemies.forEach(enemy=>{
  // 自車より遅い敵車は、相対速度で画面下へ流れる
  enemy.y+=speed-enemy.speedOffset;
  // 敵車の横位置を、そのY座標における道路中心に毎フレーム合わせる
  // これでS字カーブでも車線を維持して走る
  const eCenter=getCourseCenterX(enemy.y+enemy.height/2);
  enemy.x=eCenter-enemy.width/2+enemy.laneOffset;
  const roadLeft=eCenter-courseWidth/2;
  const roadRight=eCenter+courseWidth/2;
  enemy.x=Math.max(roadLeft+5,Math.min(roadRight-enemy.width-5,enemy.x));
  if(enemy.y>canvas.height)resetEnemy(enemy);

  if(player.x<enemy.x+enemy.width&&
     player.x+player.width>enemy.x&&
     player.y<enemy.y+enemy.height&&
     player.y+player.height>enemy.y)gameOver=true;
 });
}

function drawCar(x,y,color,isPlayer=false){
 ctx.fillStyle=color;ctx.fillRect(x,y,12,18);
 ctx.fillStyle="#111";
 ctx.fillRect(x-2,y+2,2,4);ctx.fillRect(x+12,y+2,2,4);
 ctx.fillRect(x-2,y+12,2,4);ctx.fillRect(x+12,y+12,2,4);
 ctx.fillStyle=isPlayer?"#9bdcf0":"#b8d5e8";
 ctx.fillRect(x+3,y+4,6,5);
 if(isPlayer){ctx.fillStyle="#fff2c4";ctx.fillRect(x+2,y,3,2);ctx.fillRect(x+7,y,3,2);}
}

function draw(){
 ctx.fillStyle="#008800";ctx.fillRect(0,0,256,240);
 for(let y=0;y<240;y++){
  const center=getCourseCenterX(y),left=center-courseWidth/2;
  ctx.fillStyle="#444";ctx.fillRect(left,y,courseWidth,1);
  const red=Math.floor((y-scrollY)/16)%2===0;
  ctx.fillStyle=red?"#f00":"#fff";
  ctx.fillRect(left-2,y,2,1);ctx.fillRect(left+courseWidth,y,2,1);
 }
 enemies.forEach(e=>drawCar(Math.round(e.x),Math.round(e.y),e.color,false));
 drawCar(Math.round(player.x),player.y,"#ff2222",true);

 ctx.fillStyle="#fff";ctx.font="12px monospace";
 ctx.fillText(`SCORE:${String(score).padStart(6,"0")}`,8,15);
 ctx.fillText(speed===4?"HI":"LOW",216,15);
 ctx.fillText("FC TOUGE / VER 0.4",70,232);
 if(gameOver){
  ctx.fillStyle="rgba(0,0,0,.78)";ctx.fillRect(0,0,256,240);
  ctx.fillStyle="#f00";ctx.font="bold 16px monospace";ctx.fillText("CRASH!!",91,108);
  ctx.fillStyle="#fff";ctx.font="9px monospace";ctx.fillText("PRESS SPACE / ENTER",65,128);
  ctx.fillText("TO RESTART",91,140);
 }
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
