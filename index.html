    document.addEventListener(type, stopZoom, {passive:false})
  );
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if(now-lastTouchEnd < 320) stopZoom(e);

  }, {passive:false});
  document.addEventListener('touchmove', e => {
    if(e.touches && e.touches.length > 1) stopZoom(e);
  }, {passive:false});
  document.addEventListener('dblclick', stopZoom, {passive:false});
  document.addEventListener('contextmenu', e => e.preventDefault());

  // At the front axle, positive yaw (right) moves the nose right,
  // which is negative in our left-positive lateral coordinate.
  const vxSafe=Math.max(2.0,Math.abs(vf));
  const direction=Math.sign(vf||1);
  const frontVy=vl-state.yawRate*lf;
  const rearVy=vl+state.yawRate*lr;
  const alphaFront=Math.atan2(frontVy,vxSafe)*direction-steerAngle;
  const alphaRear=Math.atan2(rearVy,vxSafe)*direction;

  // Tire cornering stiffness and friction-circle limits.
  const corneringFront=frontNormal*5.2;
  const corneringRear=rearNormal*5.5;
  let fyFront=-corneringFront*alphaFront;
  let fyRear=-corneringRear*alphaRear;
  const frontLimit=frontMu*frontNormal*.92;
  const rearLongUse=Math.abs(fx)*.48+(handActive?handBrakeForce*.35:0);
  const rearLimit=rearMu*rearNormal*.92*
    Math.sqrt(Math.max(.12,1-Math.pow(clamp(rearLongUse/(rearMu*rearNormal||1),0,.94),2)));
  fyFront=clamp(fyFront,-frontLimit,frontLimit);
  fyRear=clamp(fyRear,-rearLimit,rearLimit);

  const lateralForce=fyFront+fyRear;
  // Positive yaw is right: front-left force turns left (negative yaw).
  const yawMoment=-lf*fyFront+lr*fyRear;
  const yawDamping=handActive?1.8:2.8;
  const yawAccel=yawMoment/iz-state.yawRate*yawDamping;
  state.yawRate=clamp(state.yawRate+yawAccel*dt,-1.65,1.65);

  // Rotating-body correction for forward/left-positive coordinates.
  const longitudinalAccel=fx/mass-state.yawRate*vl;
  const lateralAccel=lateralForce/mass+state.yawRate*vf;
  vf+=longitudinalAccel*dt;
  vl+=lateralAccel*dt;

  // Mild lateral damping at parking speed prevents numerical drift.
  if(Math.abs(vf)<1.2&&!throttle) vl*=Math.max(0,1-dt*2.0);
  if(!throttle&&!brake&&Math.abs(vf)<.7) vf*=Math.max(0,1-dt*2.5);

  state.yaw+=state.yawRate*dt;
  const cc=Math.cos(state.yaw), ss=Math.sin(state.yaw);
  state.vx=vf*ss-vl*cc;
  state.vz=vf*cc+vl*ss;
  state.x+=state.vx*dt;
  state.z+=state.vz*dt;
  state.y+=(roadInfo.y-.12-state.y)*Math.min(1,dt*8);

  car.position.set(state.x,state.y,state.z);
  const pitch=clamp(-longitudinalAccel*.014,-.10,.10);
  const roll=clamp(-lateralAccel*.010,-.10,.10);
  car.rotation.set(pitch,state.yaw+Math.PI,roll);

  document.getElementById('surface').textContent=onRoad?'ASPHALT':'GRAVEL · LOW GRIP';
  document.getElementById('surface').style.color=onRoad?'#b9d9c3':'#ffb27c';
  for(const w of wheels){
    w.spin.rotation.x+=vf*dt/wheelRadius;
    w.pivot.rotation.y=(w.z<0)?steerAngle:0;
  }

  const kmh=Math.round(Math.abs(vf)*3.6);
  speedEl.textContent=String(kmh).padStart(3,'0');
  gearEl.textContent=String(gear);
  rpmText.textContent=Math.round(rpm).toLocaleString('en-US')+' RPM';
  rpmBar.style.width=(rpm/7200*100)+'%';
  rpmBar.style.background=rpm>6200?'#ef795e':rpm>5000?'#e6c46a':'#73d6a0';
  const slipAngle=Math.atan2(Math.abs(vl),Math.max(1,Math.abs(vf)))*180/Math.PI;
  const driftLabel=Math.abs(alphaRear)>Math.abs(alphaFront)+.08?'OVERSTEER':(Math.abs(alphaFront)>Math.abs(alphaRear)+.08?'UNDERSTEER':'GRIP');
  document.getElementById('telemetry').innerHTML=`車両：TS-86R<br>駆動：FR / 6MT<br>回転数：${Math.round(rpm)} RPM<br>横すべり：${Math.round(slipAngle)}°<br>${driftLabel}${handActive?' · HANDBRAKE':''}`;
}
function updateCamera(dt){if(camMode===0){const back=new THREE.Vector3(Math.sin(state.yaw)*9,4.1,Math.cos(state.yaw)*9);const target=new THREE.Vector3(state.x-back.x,state.y+back.y,state.z-back.z);camera.position.lerp(target,1-Math.exp(-4*dt));camera.lookAt(state.x,state.y+1,state.z)}else{const p=cockpit.getWorldPosition(new THREE.Vector3());const dir=new THREE.Vector3(Math.sin(state.yaw),0,Math.cos(state.yaw));camera.position.copy(p);camera.lookAt(p.clone().add(dir.multiplyScalar(15)).add(new THREE.Vector3(0,-.3,0)))} }
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);updatePhysics(dt);updateCamera(dt);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
</script></body></html>
