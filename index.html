<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FC Touge Racing - Prototype 0.2</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; display:flex; justify-content:center; align-items:center; touch-action:none; }
  canvas { width:min(100vw, 106.67vh); height:min(93.75vh, 100vw * .9375); max-width:100vw; max-height:100vh; image-rendering:pixelated; border:4px solid #fff; box-shadow:0 0 20px rgba(255,255,255,.2); }
  #touch { position:fixed; bottom:max(14px,env(safe-area-inset-bottom)); left:0; right:0; display:flex; justify-content:space-between; padding:0 18px; pointer-events:none; }
  .pad { display:flex; gap:12px; pointer-events:auto; }
  button { width:64px; height:58px; border:2px solid #fff; border-radius:8px; color:#fff; background:#222d; font:bold 22px monospace; touch-action:none; }
  button:active, button.active { background:#a33; }
  @media (hover:hover) and (pointer:fine) { #touch { display:none; } }
</style>
</head>
<body>
<canvas id="gameCanvas" width="256" height="240"></canvas>
<div id="touch">
  <div class="pad"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="pad"><button id="accelerate">HI</button></div>
</div>
<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  let scrollY = 0, speed = 2, score = 0, gameOver = false, frame = 0;
  const courseWidth = 100;
  const player = { x:120, y:180, width:12, height:18, steerSpeed:3 };
  const enemies = [];
  const keys = {};
  const touch = { left:false, right:false, accelerate:false };

  addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key)) e.preventDefault();
  }, {passive:false});
  addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

  function bindButton(id, key) {
    const el = document.getElementById(id);
    const down = e => { e.preventDefault(); touch[key] = true; el.classList.add("active"); };
    const up = e => { e.preventDefault(); touch[key] = false; el.classList.remove("active"); };
    el.addEventListener("pointerdown", down);
    ["pointerup","pointercancel","pointerleave","lostpointercapture"].forEach(type => el.addEventListener(type, up));
  }
  bindButton("left","left"); bindButton("right","right"); bindButton("accelerate","accelerate");

  const pressed = key => !!keys[key];
  const leftHeld = () => pressed("arrowleft") || pressed("a") || touch.left;
  const rightHeld = () => pressed("arrowright") || pressed("d") || touch.right;
  const highGear = () => pressed("arrowup") || pressed("w") || touch.accelerate;

  // 複数の波を重ねて、ゆるい区間と急カーブを作る
  function getCourseCenterX(y) {
    const p = y - scrollY;
    return 128
      + Math.sin(p * 0.010) * 27
      + Math.sin(p * 0.021 + 1.4) * 17
      + Math.sin(p * 0.0042 + 0.7) * 19;
  }

  function spawnEnemy() {
    const y = -22;
    const center = getCourseCenterX(y);
    const laneOffset = Math.random() < 0.5 ? -25 : 25;
    const x = center + laneOffset - 6;
    enemies.push({ x, y, width:12, height:18, speed:0.8, color:Math.random()<0.5?"#2876ee":"#f0d33b" });
  }

  function resetGame() {
    scrollY=0; speed=2; score=0; gameOver=false; frame=0;
    player.x=120; enemies.length=0;
  }

  function update() {
    if (gameOver) { if (pressed(" ") || pressed("enter")) resetGame(); return; }
    speed = highGear() ? 4 : 2;
    scrollY += speed;
    frame++;
    score += speed === 4 ? 2 : 1;

    if (leftHeld()) player.x -= player.steerSpeed;
    if (rightHeld()) player.x += player.steerSpeed;

    // 敵車は画面上から出現し、自車より遅い相対速度で下へ流れる
    if (frame % 78 === 0 && enemies.length < 4) spawnEnemy();
    for (let i=enemies.length-1; i>=0; i--) {
      const enemy=enemies[i];
      enemy.y += speed - enemy.speed;
      if (enemy.y > canvas.height + 24) enemies.splice(i,1);
    }

    const center=getCourseCenterX(player.y + player.height/2);
    const left=center-courseWidth/2, right=center+courseWidth/2;
    if (player.x < left || player.x+player.width > right) gameOver=true;

    for (const enemy of enemies) {
      const hit = player.x < enemy.x+enemy.width-2 &&
        player.x+player.width > enemy.x+2 &&
        player.y < enemy.y+enemy.height-2 &&
        player.y+player.height > enemy.y+2;
      if (hit) gameOver=true;
    }
  }

  function drawCar(x,y,color,isPlayer=false) {
    ctx.fillStyle=color; ctx.fillRect(x,y,12,18);
    ctx.fillStyle="#111";
    ctx.fillRect(x-2,y+2,2,4); ctx.fillRect(x+12,y+2,2,4);
    ctx.fillRect(x-2,y+12,2,4); ctx.fillRect(x+12,y+12,2,4);
    ctx.fillStyle=isPlayer?"#9be7ff":"#c9d8e8";
    ctx.fillRect(x+3,y+4,6,5);
    ctx.fillStyle="#fff2c4";
    if(isPlayer){ctx.fillRect(x+2,y,3,2);ctx.fillRect(x+7,y,3,2);}
    else {ctx.fillRect(x+2,y+16,3,2);ctx.fillRect(x+7,y+16,3,2);}
  }

  function draw() {
    ctx.fillStyle="#008800"; ctx.fillRect(0,0,256,240);
    for(let y=0;y<240;y++) {
      const center=getCourseCenterX(y), left=center-courseWidth/2;
      ctx.fillStyle="#444"; ctx.fillRect(left,y,courseWidth,1);
      const red=Math.floor((y-scrollY)/16)%2===0;
      ctx.fillStyle=red?"#ff0000":"#fff";
      ctx.fillRect(left-2,y,3,1); ctx.fillRect(left+courseWidth-1,y,3,1);
      // 路肩の点線で速度感を出す
      if(Math.floor((y-scrollY)/12)%2===0) {
        ctx.fillStyle="#b8b8b8";
        ctx.fillRect(center-1,y,2,1);
      }
    }

    for(const enemy of enemies) drawCar(Math.round(enemy.x),Math.round(enemy.y),enemy.color,false);
    drawCar(Math.round(player.x),player.y,"#ff2222",true);

    ctx.fillStyle="#fff"; ctx.font="12px monospace";
    ctx.fillText(`SCORE:${String(score).padStart(6,"0")}`,10,15);
    ctx.fillText(speed===4?"HI":"LOW",210,15);
    if(gameOver) {
      ctx.fillStyle="rgba(0,0,0,.78)";ctx.fillRect(0,0,256,240);
      ctx.fillStyle="#ff3333";ctx.font="bold 16px monospace";ctx.fillText("CRASH!!",91,108);
      ctx.fillStyle="#fff";ctx.font="9px monospace";ctx.fillText("PRESS SPACE / ENTER",65,128);
      ctx.fillText("TO RESTART",91,140);
    }
  }

  function loop(){update();draw();requestAnimationFrame(loop);}
  loop();
})();
</script>
</body>
</html>
