<html lang="ja">
<head>

<meta name="theme-color" content="#101820"><title>峠魂 - TOUGE SPIRIT - Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}

.brandBlock{min-width:0;text-shadow:0 2px 8px #000}
.brand{font-size:clamp(17px,2.1vw,25px);font-weight:900;letter-spacing:.12em;white-space:nowrap}
.sub{font-size:clamp(8px,1vw,11px);color:#b9c8d0;letter-spacing:.16em;white-space:nowrap}
.dashGroup{display:flex;align-items:flex-start;gap:9px}
.panel{background:#071018d9;border:1px solid #ffffff35;border-radius:15px;padding:9px 13px;backdrop-filter:blur(10px);box-shadow:0 5px 18px #0004}
.dash{min-width:174px}

#camBtn{pointer-events:auto;touch-action:manipulation;border:1px solid #ffffff50;background:#071018df;color:white;border-radius:13px;padding:12px 14px;min-height:48px;font-size:11px;font-weight:800;white-space:nowrap}

#surface{color:#b9d9c3}

.ctrl.active{background:#d95b28e8;border-color:#ffb18e;transform:scale(.97)}

@media(orientation:portrait){
 .top{gap:5px}
 .brand{font-size:15px}
 .sub{font-size:7px;letter-spacing:.1em}

 #gear{font-size:17px}

 #telemetry{top:calc(env(safe-area-inset-top,0px) + 62px);font-size:9px;padding:6px 8px;min-width:120px}

 .ctrl{width:49px;height:52px;border-radius:13px;font-size:10px}

 #controls .drivingCluster{gap:5px}

}
@media(max-height:430px) and (orientation:landscape){
 .top{top:6px}

 #damage{top:68px}

 .ctrl.big{height:66px;width:70px}

 #footer{display:none}
}
@media(min-width:1000px){
 #controls{max-width:1300px;left:50%;right:auto;width:100%;transform:translateX(-50%)}
}

<body><div id="hud">
<div class="top">

  <div class="panel dash"><div class="speedLine"><span id="speed">000</span><span id="unit">KM/H</span><span class="gearLabel">GEAR</span><span id="gear">1</span></div><div id="rpmWrap"><div id="rpmBar"></div></div><div id="rpmText">950 RPM</div></div>

</div>
</div>

  </div>
</div>
</div>
<script type="module">

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,900);camera.position.set(0,5,10);

scene.add(new THREE.HemisphereLight(0xdcecff,0x40503a,2.0));const sun=new THREE.DirectionalLight(0xffe0b3,2.4);sun.position.set(-80,130,60);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});

// Procedural mountain silhouettes
for(let i=0;i<70;i++){const a=i/70*Math.PI*2,rad=115+Math.random()*75,h=18+Math.random()*48;const m=new THREE.Mesh(new THREE.ConeGeometry(12+Math.random()*18,h,5),mat(i%3?0x53665b:0x68786a));m.position.set(Math.cos(a)*rad,h/2-1,Math.sin(a)*rad);m.rotation.y=Math.random()*2;scene.add(m)}
// Winding mountain road, generated as a smooth 3D curve and ribbon
const pts=[];for(let i=0;i<18;i++){const z=-105+i*12;const x=Math.sin(i*.68)*23+Math.sin(i*.21)*9;const y=1.2+Math.sin(i*.55)*2.2;pts.push(new THREE.Vector3(x,y,z))}const path=new THREE.CatmullRomCurve3(pts);const roadPts=path.getPoints(900);const verts=[],indices=[];for(let i=0;i<roadPts.length;i++){const p=roadPts[i],t=path.getTangent(i/(roadPts.length-1)).normalize(),side=new THREE.Vector3(-t.z,0,t.x).normalize();verts.push(p.x+side.x*5.2,p.y,p.z+side.z*5.2,p.x-side.x*5.2,p.y,p.z-side.z*5.2);if(i<roadPts.length-1){let n=i*2;indices.push(n,n+1,n+2,n+1,n+3,n+2)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();const road=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x34383a,roughness:1,side:THREE.DoubleSide}));road.receiveShadow=true;scene.add(road);
// Road edge lines and dashed center markers
function makeRibbon(offset,width,color,yoff=.035){const v=[],ix=[];for(let i=0;i<roadPts.length;i++){const p=roadPts[i],t=path.getTangent(i/(roadPts.length-1)).normalize(),s=new THREE.Vector3(-t.z,0,t.x).normalize();for(const d of [offset-width/2,offset+width/2])v.push(p.x+s.x*d,p.y+yoff,p.z+s.z*d);if(i<roadPts.length-1){let n=i*2;ix.push(n,n+1,n+2,n+1,n+3,n+2)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(ix);g.computeVertexNormals();scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}))) }
makeRibbon(4.92,.13,0xd5d0b8);makeRibbon(-4.92,.13,0xd5d0b8);
for(let i=0;i<roadPts.length-1;i+=13){const p=roadPts[i],t=path.getTangent(i/(roadPts.length-1)).normalize(),s=new THREE.Vector3(-t.z,0,t.x).normalize();const dash=new THREE.Mesh(new THREE.BoxGeometry(.13,.035,2.2),mat(0xd8d0ae));dash.position.set(p.x,p.y+.055,p.z);dash.rotation.y=Math.atan2(t.x,t.z);scene.add(dash)}
// Guard posts along the outside edges
for(let i=8;i<roadPts.length;i+=12){const p=roadPts[i],t=path.getTangent(i/(roadPts.length-1)).normalize(),s=new THREE.Vector3(-t.z,0,t.x).normalize();for(const side of [-1,1]){const post=new THREE.Mesh(new THREE.BoxGeometry(.13,.8,.13),mat(0xb9b7a8));post.position.set(p.x+s.x*side*5.55,p.y+.4,p.z+s.z*side*5.55);post.castShadow=true;scene.add(post)}}
// Scattered stylized trees
for(let i=0;i<250;i++){const a=Math.random()*Math.PI*2,r=20+Math.random()*115,x=Math.cos(a)*r,z=Math.sin(a)*r;let near=1e9;for(let j=0;j<roadPts.length;j+=8){const q=roadPts[j],d=(q.x-x)**2+(q.z-z)**2;if(d<near)near=d}if(near<150)continue;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,2.2,5),mat(0x493b2c));trunk.position.set(x,.4,z);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.7+Math.random()*1.5,5+Math.random()*4,6),mat([0x263f32,0x304b38,0x405b3e][i%3]));crown.position.set(x,3.5,z);crown.castShadow=true;scene.add(trunk,crown)}
// Car group: stylized fictional FR coupe
const car=new THREE.Group();scene.add(car);const bodyMat=mat(0xc64b32,.48),glassMat=new THREE.MeshStandardMaterial({color:0x17252d,metalness:.25,roughness:.25});const chassis=new THREE.Mesh(new THREE.BoxGeometry(1.9,.52,4.05),bodyMat);chassis.position.y=.82;chassis.castShadow=true;car.add(chassis);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.82,.18,1.3),bodyMat);hood.position.set(0,1.08,-1.18);car.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.52,.66,1.8),glassMat);cabin.position.set(0,1.35,.05);cabin.castShadow=true;car.add(cabin);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.5,.12,1.2),bodyMat);roof.position.set(0,1.72,.05);car.add(roof);
const wheels=[];for(const x of [-.98,.98])for(const z of [-1.32,1.32]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.24,16),mat(0x151719));w.rotation.z=Math.PI/2;w.position.set(x,.43,z);w.castShadow=true;car.add(w);wheels.push({mesh:w,x,z})}
const lampMat=new THREE.MeshBasicMaterial({color:0xffefc2});for(const x of [-.62,.62]){const l=new THREE.Mesh(new THREE.BoxGeometry(.38,.13,.06),lampMat);l.position.set(x,.92,-2.04);car.add(l)}
// Cockpit viewpoint marker
const cockpit=new THREE.Object3D();cockpit.position.set(0,1.52,-.05);car.add(cockpit);
// Physics state: planar vehicle dynamics with yaw inertia, tire slip, traction and load transfer approximation
const spawnIndex=36,spawnT=spawnIndex/(roadPts.length-1),spawnPoint=roadPts[spawnIndex],spawnTangent=path.getTangent(spawnT).normalize();
const state={x:spawnPoint.x,y:spawnPoint.y-.12,z:spawnPoint.z,vx:0,vz:0,yaw:Math.atan2(spawnTangent.x,spawnTangent.z),yawRate:0,steer:0,gear:1};

const input={left:false,right:false,throttle:false,brake:false,hand:false,shiftUp:false,shiftDown:false};const keyMap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'throttle',w:'throttle',ArrowDown:'brake',s:'brake',' ':'hand',e:'shiftUp',q:'shiftDown'};addEventListener('keydown',e=>{const k=keyMap[e.key];if(k){input[k]=true;e.preventDefault()}});addEventListener('keyup',e=>{const k=keyMap[e.key];if(k)input[k]=false});document.querySelectorAll('[data-control]').forEach(el=>{
  const k=el.dataset.control;
  const down=e=>{
    e.preventDefault();
    if(el.setPointerCapture) el.setPointerCapture(e.pointerId);
    input[k]=true;
    el.classList.add('active');
  };
  const up=e=>{
    e.preventDefault();

let camMode=0,gear=1,rpm=950,shiftCooldown=0,prevShiftUp=false,prevShiftDown=false;const camBtn=document.getElementById('camBtn');camBtn.addEventListener('click',()=>{camMode=1-camMode;camBtn.textContent=camMode?'CAM: COCKPIT':'CAM: CHASE'});
const speedEl=document.getElementById('speed'),gearEl=document.getElementById('gear'),hint=document.getElementById('hint'),rpmBar=document.getElementById('rpmBar'),rpmText=document.getElementById('rpmText');setTimeout(()=>hint.style.opacity=0,5500);
const clock=new THREE.Clock();
let smoothedSteer=0;
function nearestRoadInfo(x,z){
  let best=1e9,y=0;
  for(let i=0;i<roadPts.length;i+=2){
    const p=roadPts[i],d=(p.x-x)**2+(p.z-z)**2;

  return {y,distance:Math.sqrt(best)};

function updatePhysics(dt){
 const c=Math.cos(state.yaw),s=Math.sin(state.yaw);
 const forwardX=s,forwardZ=c,rightX=c,rightZ=-s;

}
function updateCamera(dt){if(camMode===0){const back=new THREE.Vector3(Math.sin(state.yaw)*9,4.1,Math.cos(state.yaw)*9);const target=new THREE.Vector3(state.x-back.x,state.y+back.y,state.z-back.z);camera.position.lerp(target,1-Math.exp(-4*dt));camera.lookAt(state.x,state.y+1,state.z)}else{const p=cockpit.getWorldPosition(new THREE.Vector3());const dir=new THREE.Vector3(Math.sin(state.yaw),0,Math.cos(state.yaw));camera.position.copy(p);camera.lookAt(p.clone().add(dir.multiplyScalar(15)).add(new THREE.Vector3(0,-.3,0)))} }
